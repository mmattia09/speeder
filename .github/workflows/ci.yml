name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Localizations
        run: python3 Scripts/check-localizations.py
      - name: Tests
        run: swift test
      - name: Build app
        run: Scripts/build-app.sh release universal
      - name: Verify bundle
        run: |
          plutil -lint dist/Speeder.app/Contents/Info.plist
          codesign --verify --strict dist/Speeder.app
          lipo dist/Speeder.app/Contents/MacOS/Speeder -verify_arch arm64 x86_64
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Speeder.app dist/Speeder.zip
      - name: Build disk image
        run: Scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Speeder-macOS
          path: |
            dist/Speeder.zip
            dist/Speeder.dmg
